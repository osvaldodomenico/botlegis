version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: mv2026_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mv2026
      MYSQL_DATABASE: mv2026_db
      MYSQL_USER: mv2026_user
      MYSQL_PASSWORD: mv2026_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmv2026"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mv2026_net

  redis:
    image: redis:7-alpine
    container_name: mv2026_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mv2026_net

  adminer:
    image: adminer:latest
    container_name: mv2026_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mv2026_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mv2026_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://mv2026_user:mv2026_pass@mysql:3306/mv2026_db
      JWT_SECRET: mv2026-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 8000
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mv2026_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mv2026_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - mv2026_net

volumes:
  mysql_data:
  redis_data:

networks:
  mv2026_net:
    driver: bridge
