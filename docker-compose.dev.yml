version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: mv2026_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mv2026
      MYSQL_DATABASE: mv2026_db
      MYSQL_USER: mv2026_user
      MYSQL_PASSWORD: mv2026_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmv2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mv2026_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data

  adminer:
    image: adminer:latest
    container_name: mv2026_adminer_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data_dev:
  redis_data_dev:
